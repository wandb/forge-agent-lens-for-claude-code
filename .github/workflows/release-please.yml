name: Release Please

# Keeps the release PR current. Merging it tags vX.Y.Z, creates the GitHub
# release, and dispatches Publish Package on that tag.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # release commits, tags, and GitHub releases
      issues: write  # create the labels it uses to track the release PR
      pull-requests: write  # the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5

  # Tags created with the default GITHUB_TOKEN start no workflows, so
  # dispatch Publish Package on the new tag instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # dispatch publish.yml
    steps:
      - name: Dispatch Publish Package on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME"
